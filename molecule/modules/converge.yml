- name: Converge
  hosts: all
  vars:
    influxdb2_influxdb2_admin_token: 123456789abc!
    influxdb2_influxdb2_orgs:
      - name: org1
        desc: "This is a description"
        token: "{{ influxdb2_influxdb2_admin_token }}"
        verify_ssl: false
    influxdb2_influxdb2_force_pip: true

    influxdb2_influxdb2_buckets:
      - name: bucket-1
        desc: "This is a description"
        org: org1
        token: "{{ influxdb2_influxdb2_admin_token }}"
        verify_ssl: false
        retention:
          type: 'expire'
          everySeconds: '60000'
          shardGroupDurationSeconds: '7600'

    influxdb2_influxdb2_tokens:
      - name: token-1
        state: present
        org: org1
        token: "{{ influxdb2_influxdb2_admin_token }}"
        verify_ssl: false
        permissions:
          - buckets:
              - action: read
                bucket: bucket-1
              - action: write
                bucket: bucket-1
          - dashboards:
              - action: read
          - variables:
              - action: read
              - action: write

  collections:
    - tbauriedel.influxdb2

  roles:
    - repos
    - influxdb2
