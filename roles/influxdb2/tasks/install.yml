---
- name: Install python3 packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
    state: present

- name: Install influxdb-client via block for rescue
  when:
    - not influxdb_force_pip | bool
  block:
    - name: Install influxdb-client for python
      ansible.builtin.pip:
        name: influxdb-client
        state: present
  rescue:
    - name: Fail with error message
      fail:
        msg: NOTE You can force this installation. See README about variable influxdb_force_pip

- name: Install influxb-client for python (forced)
  ansible.builtin.pip:
    name: influxdb-client
    state: present
    break_system_packages: true
  when:
    - influxdb_force_pip | bool

- name: Install InfluxDB
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ influxdb_influxdb2_packages }}"
  notify: Restart InfluxDB

- name: Ensure startup config is placed
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/influxdb/config.toml
    mode: 0644
    owner: root
    group: root

- name: Ensure InfluxDB is started
  ansible.builtin.service:
    name: influxdb
    state: started
