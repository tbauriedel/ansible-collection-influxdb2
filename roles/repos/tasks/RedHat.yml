---
- name: Yum - Add repositiory key
  ansible.builtin.rpm_key:
    state: present
    key: "{{ influxdb2_repos_key_url }}"

- name: Yum - Add repository to list
  ansible.builtin.yum_repository:
    state: present
    enabled: true
    name: influxdb
    description: Stable InfluxDB repository
    baseurl: "{{ influxdb2_repos_stable_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ influxdb2_repos_key_url }}"
